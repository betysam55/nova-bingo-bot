[project]
name = "nova-bingo-bot"
version = "1.0.0"
description = "Nova Bingo AI Assistant - Telegram Bingo gaming bot"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "python-telegram-bot==21.10",
    "python-dotenv==1.2.2",
]

[project.scripts]
nova-bingo-bot = "src.bot:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
